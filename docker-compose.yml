services:

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1882
      POSTGRES_DB: studymate

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: sajeerrr/studymate
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:1882@db:5432/studymate

    depends_on:
      - db

volumes:
  postgres_data: